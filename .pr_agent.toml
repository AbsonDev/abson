[config]
model = "openai/deepseek-v4.1-flash"
fallback_models = []
custom_model_max_tokens = 128000
restricted_mode = true
response_language = "pt-BR"

[litellm]
# OpenCode Go exige um session id por conversa; o PR-Agent monta a partir da URL do PR.
add_session_id_to_requests = true

[pr_reviewer]
num_max_findings = 6
require_tests_review = false
extra_instructions = """
Monorepo Abson. Só Projetos/fisga/** está em produção.
Priorize bugs de lógica, segurança (OAuth/callback, secrets), contratos de API, migrações e
violação das invariantes de CI/CD documentadas em AGENTS.md e docs/ci-cd.md.
Ignore estilo já coberto por dotnet format e astro check. Não comente em docs/**.
"""
