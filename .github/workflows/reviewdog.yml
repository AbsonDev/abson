name: reviewdog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: actionlint
        uses: reviewdog/action-actionlint@v1.84.1
        with:
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
