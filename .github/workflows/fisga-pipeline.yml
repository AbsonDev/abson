name: fisga-pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fisga-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NODE_VERSION: "24"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fisga: ${{ steps.diff.outputs.fisga }}
      documentacao: ${{ steps.diff.outputs.documentacao }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detectar mudanças do Fisga
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fisga=true" >> "$GITHUB_OUTPUT"
            echo "documentacao=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
          fi

          FILES="$(git diff --name-only "$BASE" "$HEAD")"

          # Código = qualquer arquivo do Fisga que não seja documentação.
          CODIGO="$(printf '%s\n' "$FILES" \
            | grep -E '^Projetos/fisga/' \
            | grep -vE '^Projetos/fisga/(docs/|README\.md$|AGENTS\.md$)' || true)"
          # O contrato gerado conta como código: mudá-lo à mão precisa passar
          # pelo build do job api, que regenera e compara.
          GERADO="$(printf '%s\n' "$FILES" \
            | grep -E '^Projetos/fisga/docs/api/openapi\.json$' || true)"
          WORKFLOWS="$(printf '%s\n' "$FILES" \
            | grep -E '^\.github/workflows/fisga-pipeline\.yml$' || true)"
          DOCUMENTACAO="$(printf '%s\n' "$FILES" \
            | grep -E '^Projetos/fisga/(docs/|README\.md$|AGENTS\.md$)|^AGENTS\.md$|^\.github/(copilot-instructions\.md|PULL_REQUEST_TEMPLATE\.md)$|^\.markdownlint-cli2\.jsonc$|^\.lychee\.toml$' \
            | grep -vE '^Projetos/fisga/docs/api/openapi\.json$' || true)"

          if [ -n "$CODIGO" ] || [ -n "$GERADO" ] || [ -n "$WORKFLOWS" ]; then
            echo "fisga=true" >> "$GITHUB_OUTPUT"
          else
            echo "fisga=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DOCUMENTACAO" ]; then
            echo "documentacao=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentacao=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.fisga == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Projetos/fisga
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: Projetos/fisga/global.json
          cache: true
          cache-dependency-path: Projetos/fisga/**/packages.lock.json

      - name: Restore
        run: dotnet restore Fisga.slnx --locked-mode

      - name: Format
        run: dotnet format Fisga.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Fisga.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test Fisga.slnx -c Release --no-build
          --logger "trx;LogFileName=fisga-tests.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fisga-test-results
          path: Projetos/fisga/artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Gerar OpenAPI
        run: ./scripts/gerar-openapi.sh

      - name: Contrato documentado está atualizado
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/api/openapi.json; then
            echo "::error::docs/api/openapi.json está desatualizado. Rode ./scripts/gerar-openapi.sh e commite."
            exit 1
          fi

      - name: Publicar OpenAPI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fisga-openapi
          path: Projetos/fisga/docs/api/openapi.json
          retention-days: 30

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.fisga == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Projetos/fisga/web
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Projetos/fisga/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (E2E)
        run: npm run build
        env:
          PUBLIC_API_URL: http://localhost:5184
          PUBLIC_SITE_URL: http://localhost:4323
          PUBLIC_SENTRY_DSN: ""
          PUBLIC_SENTRY_ENVIRONMENT: test
          PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (mock)
        run: npm run test:e2e

  docs:
    name: docs
    needs: changes
    # Só em PR: link externo que morre depois do merge não pode bloquear o
    # deploy de código já mergeado.
    if: |
      github.event_name != 'push' &&
      (needs.changes.outputs.documentacao == 'true' || needs.changes.outputs.fisga == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Markdown
        run: npx --yes markdownlint-cli2@0.24.1

      - name: Links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Sobrescrever `args` descarta os globs padrão da action: inclua-os.
          args: >-
            --config .lychee.toml --no-progress --verbose
            'AGENTS.md' 'Projetos/fisga/README.md' 'Projetos/fisga/AGENTS.md'
            'Projetos/fisga/docs/**/*.md'
          fail: true

  docker:
    name: docker
    needs: changes
    if: |
      needs.changes.outputs.fisga == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verificar token do Sentry no Dockerfile
        run: |
          set -euo pipefail
          if grep -qE '^(ARG|ENV) SENTRY_AUTH_TOKEN' Projetos/fisga/web/Dockerfile; then
            echo "SENTRY_AUTH_TOKEN não pode ser ARG/ENV; use BuildKit secret."
            exit 1
          fi
          grep -q 'type=secret,id=sentry_auth_token' Projetos/fisga/web/Dockerfile

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build API image
        uses: docker/build-push-action@v7.4.0
        with:
          context: Projetos/fisga
          file: Projetos/fisga/src/Fisga.Api/Dockerfile
          push: false
          load: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=fisga-api
          cache-to: type=gha,mode=max,scope=fisga-api

      - name: Build web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: Projetos/fisga/web
          push: false
          load: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            PUBLIC_API_URL=https://api.fisga.abson.tech
            PUBLIC_SITE_URL=https://fisga.abson.tech
            PUBLIC_SENTRY_DSN=${{ vars.FISGA_PUBLIC_SENTRY_DSN }}
            PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=fisga-web
          cache-to: type=gha,mode=max,scope=fisga-web

  gate:
    name: gate
    if: always()
    needs:
      - changes
      - api
      - web
      - docker
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mostrar resultados
        run: echo '${{ toJSON(needs) }}'

      - name: Falhar se algum job necessário falhou
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Um job necessário falhou ou foi cancelado."
            exit 1
          fi
