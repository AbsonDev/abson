name: fisga-deploy

on:
  workflow_run:
    workflows:
      - fisga-pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fisga-production
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fisga: ${{ steps.diff.outputs.fisga }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detectar mudanças do Fisga
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          HEAD="${{ github.event.workflow_run.head_sha }}"
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          else
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          FILES="$(git diff --name-only "$BASE" "$HEAD")"
          if echo "$FILES" | grep -qE '^Projetos/fisga/|^\.github/workflows/fisga-(pipeline|deploy)\.yml$'; then
            echo "fisga=true" >> "$GITHUB_OUTPUT"
          else
            echo "fisga=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: deploy-api
    needs:
      - changes
    if: |
      needs.changes.outputs.fisga == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.fisga.abson.tech
    steps:
      - name: Validar secrets e HTTPS
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FISGA_API }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?Configure o secret COOLIFY_URL (ex.: https://manager.abson.tech)}"
          : "${COOLIFY_TOKEN:?Configure o secret COOLIFY_TOKEN com read+deploy}"
          : "${COOLIFY_WEBHOOK:?Configure o secret COOLIFY_WEBHOOK_FISGA_API}"
          case "$COOLIFY_URL" in https://*) ;; *) echo "COOLIFY_URL deve usar HTTPS"; exit 1 ;; esac
          case "$COOLIFY_WEBHOOK" in https://*) ;; *) echo "COOLIFY_WEBHOOK_FISGA_API deve usar HTTPS"; exit 1 ;; esac

      - name: Disparar deploy da API
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FISGA_API }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body -sS --max-time 30 --proto '=https' -X POST "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")"
          DEPLOYMENT_UUID="$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOYMENT_UUID" ]; then
            echo "Coolify não retornou deployment_uuid. Resposta:"
            printf '%s\n' "$RESPONSE"
            exit 1
          fi
          echo "deployment_uuid=$DEPLOYMENT_UUID" >> "$GITHUB_OUTPUT"

      - name: Aguardar deployment da API
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          API="${COOLIFY_URL%/}"
          API="${API%/api/v1}"
          for i in $(seq 1 120); do
            STATUS="$(curl -fsS --max-time 15 --proto '=https' \
              "$API/api/v1/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]' || true)"
            case "$STATUS" in
              finished|success)
                echo "Deployment $DEPLOYMENT_UUID concluído ($STATUS)"
                exit 0
                ;;
              failed|cancelled)
                echo "Deployment $DEPLOYMENT_UUID terminou com status $STATUS"
                exit 1
                ;;
            esac
            echo "Aguardando deployment: status=${STATUS:-indisponível} (tentativa $i/120)"
            sleep 10
          done
          echo "Timeout aguardando o deployment $DEPLOYMENT_UUID"
          exit 1

      - name: Aguardar a versão da API
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            VERSION="$(curl -fsS --max-time 10 https://api.fisga.abson.tech/health | jq -r '.version // empty' || true)"
            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "API no ar na versão $EXPECTED"
              exit 0
            fi
            echo "Aguardando API: versão atual=${VERSION:-indisponível} (tentativa $i/60)"
            sleep 5
          done
          echo "Timeout aguardando a API na versão $EXPECTED"
          exit 1

      - name: Smoke da API
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://api.fisga.abson.tech/ready

      - name: Smoke do web atual antes do deploy do web
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://fisga.abson.tech/ >/dev/null || {
            echo "O web atual não respondeu com a API nova. Faça rollback da API no Coolify antes de continuar."
            exit 1
          }
          curl -fsS --max-time 10 https://fisga.abson.tech/condicoes >/dev/null || {
            echo "O web atual não respondeu em /condicoes com a API nova. Faça rollback da API no Coolify antes de continuar."
            exit 1
          }

  deploy-web:
    name: deploy-web
    needs:
      - changes
      - deploy-api
    if: |
      needs.changes.outputs.fisga == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://fisga.abson.tech
    steps:
      - name: Validar secrets e HTTPS
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FISGA_WEB }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?Configure o secret COOLIFY_URL (ex.: https://manager.abson.tech)}"
          : "${COOLIFY_TOKEN:?Configure o secret COOLIFY_TOKEN com read+deploy}"
          : "${COOLIFY_WEBHOOK:?Configure o secret COOLIFY_WEBHOOK_FISGA_WEB}"
          case "$COOLIFY_URL" in https://*) ;; *) echo "COOLIFY_URL deve usar HTTPS"; exit 1 ;; esac
          case "$COOLIFY_WEBHOOK" in https://*) ;; *) echo "COOLIFY_WEBHOOK_FISGA_WEB deve usar HTTPS"; exit 1 ;; esac

      - name: Disparar deploy do web
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FISGA_WEB }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body -sS --max-time 30 --proto '=https' -X POST "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")"
          DEPLOYMENT_UUID="$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOYMENT_UUID" ]; then
            echo "Coolify não retornou deployment_uuid. Resposta:"
            printf '%s\n' "$RESPONSE"
            exit 1
          fi
          echo "deployment_uuid=$DEPLOYMENT_UUID" >> "$GITHUB_OUTPUT"

      - name: Aguardar deployment do web
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          API="${COOLIFY_URL%/}"
          API="${API%/api/v1}"
          for i in $(seq 1 120); do
            STATUS="$(curl -fsS --max-time 15 --proto '=https' \
              "$API/api/v1/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]' || true)"
            case "$STATUS" in
              finished|success)
                echo "Deployment $DEPLOYMENT_UUID concluído ($STATUS)"
                exit 0
                ;;
              failed|cancelled)
                echo "Deployment $DEPLOYMENT_UUID terminou com status $STATUS"
                exit 1
                ;;
            esac
            echo "Aguardando deployment: status=${STATUS:-indisponível} (tentativa $i/120)"
            sleep 10
          done
          echo "Timeout aguardando o deployment $DEPLOYMENT_UUID"
          exit 1

      - name: Aguardar a versão do web
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            VERSION="$(curl -fsS --max-time 10 https://fisga.abson.tech/health | jq -r '.version // empty' || true)"
            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "Web no ar na versão $EXPECTED"
              exit 0
            fi
            echo "Aguardando web: versão atual=${VERSION:-indisponível} (tentativa $i/60)"
            sleep 5
          done
          echo "Timeout aguardando o web na versão $EXPECTED"
          exit 1

      - name: Smoke do web
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://fisga.abson.tech/ >/dev/null || {
            echo "Smoke do web falhou em /. Faça rollback do web no Coolify (runbook em docs/ci-cd.md)."
            exit 1
          }
          curl -fsS --max-time 10 https://fisga.abson.tech/condicoes >/dev/null || {
            echo "Smoke do web falhou em /condicoes. Faça rollback do web no Coolify (runbook em docs/ci-cd.md)."
            exit 1
          }
