name: project-sync

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed]

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    # Ignora abertura por bots e PR de fork: esses eventos não recebem o secret
    # FISGA_PROJECT_TOKEN e não devem mexer no quadro.
    if: github.event.sender.type != 'Bot' && (github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Sempre a default branch: em pull_request o checkout sem ref herda
          # refs/pull/<n>/merge (inexistente em PR com conflito) e executaria o
          # script da versão da PR com o token do quadro no ambiente.
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Sincronizar quadro
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FISGA_PROJECT_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          # A URL vem do payload do evento: passa por env para não ser interpolada no shell.
          URL="$EVENT_URL"
          STATUS="$(node scripts/github-project-sync.mjs event-status)"

          if [ -z "$STATUS" ]; then
            echo "Evento sem mudança de Status no quadro; nada a sincronizar."
            exit 0
          fi

          echo "Sincronizando ${URL} com Status \"${STATUS}\"."
          node scripts/github-project-sync.mjs add-or-sync "$URL" "$STATUS"
