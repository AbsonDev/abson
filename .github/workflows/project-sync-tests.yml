name: project-sync-tests

on:
  pull_request:
    paths:
      - 'scripts/github-project-sync*.mjs'
      - '.github/workflows/project-sync-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/github-project-sync*.mjs'
      - '.github/workflows/project-sync-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Rodar testes do script
        run: node --test scripts/github-project-sync.test.mjs
