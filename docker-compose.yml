services:
  postgres:
    image: postgres:17-alpine
    container_name: abson-postgres
    environment:
      POSTGRES_USER: abson
      POSTGRES_PASSWORD: abson
      POSTGRES_DB: abson
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abson -d abson"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: abson-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=abson;Username=abson;Password=abson
      Cors__AllowedOrigins: http://localhost:4321,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        PUBLIC_API_URL: http://localhost:8080
    container_name: abson-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
